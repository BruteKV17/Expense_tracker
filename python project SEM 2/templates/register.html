{% extends "base.html" %}
{% block title %}Register | Expense Tracker Pro{% endblock %}

{% block auth_content %}
<section class="auth-section">
    <div class="auth-bg-shape auth-bg-shape-1"></div>
    <div class="auth-bg-shape auth-bg-shape-2"></div>

    <div class="auth-card glass-panel">
        <div class="auth-brand">
            <div class="auth-logo">
                <i class="bi bi-person-plus-fill"></i>
            </div>
            <h2>Create account</h2>
            <p>Start tracking expenses with clean analytics and budget insights.</p>
        </div>

        <form method="POST" class="auth-form">
            <div class="form-group-modern">
                <label>Username</label>
                <div class="input-icon-wrap">
                    <i class="bi bi-person-fill"></i>
                    <input type="text" name="username" class="form-control modern-input" placeholder="Choose username" required>
                </div>
            </div>

            <div class="form-group-modern">
                <label>Email address</label>
                <div class="input-icon-wrap">
                    <i class="bi bi-envelope-fill"></i>
                    <input type="email" name="email" class="form-control modern-input" placeholder="you@example.com" required>
                </div>
            </div>

            <div class="form-group-modern">
                <label>Password</label>
                <div class="input-icon-wrap password-wrap">
                    <i class="bi bi-lock-fill"></i>
                    <input type="password" name="password" id="registerPassword" class="form-control modern-input" placeholder="Create password" required>
                    <button type="button" class="password-toggle" data-target="registerPassword">
                        <i class="bi bi-eye-fill"></i>
                    </button>
                </div>
            </div>

            <div class="form-group-modern">
                <label>Confirm Password</label>
                <div class="input-icon-wrap password-wrap">
                    <i class="bi bi-shield-lock-fill"></i>
                    <input type="password" name="confirm_password" id="confirmPassword" class="form-control modern-input" placeholder="Confirm password" required>
                    <button type="button" class="password-toggle" data-target="confirmPassword">
                        <i class="bi bi-eye-fill"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn premium-btn w-100">
                <span>Create Account</span>
                <i class="bi bi-stars"></i>
            </button>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
        </div>
    </div>
</section>
{% endblock %}
