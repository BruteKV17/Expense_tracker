{% extends "base.html" %}
{% block title %}Login | Expense Tracker Pro{% endblock %}

{% block auth_content %}
<section class="auth-section">
    <div class="auth-bg-shape auth-bg-shape-1"></div>
    <div class="auth-bg-shape auth-bg-shape-2"></div>

    <div class="auth-card glass-panel">
        <div class="auth-brand">
            <div class="auth-logo">
                <i class="bi bi-wallet2"></i>
            </div>
            <h2>Welcome back</h2>
            <p>Sign in to access your premium finance dashboard.</p>
        </div>

        <form method="POST" class="auth-form">
            <div class="form-group-modern">
                <label>Email address</label>
                <div class="input-icon-wrap">
                    <i class="bi bi-envelope-fill"></i>
                    <input type="email" name="email" class="form-control modern-input no-left-icon" placeholder="you@example.com" required>
                </div>
            </div>

            <div class="form-group-modern">
                <label>Password</label>
                <div class="input-icon-wrap password-wrap">
                    <i class="bi bi-lock-fill"></i>
                    <input type="password" name="password" id="loginPassword" class="form-control modern-input no-left-icon" placeholder="Enter your password" required>
                    <button type="button" class="password-toggle" data-target="loginPassword">
                        <i class="bi bi-eye-fill"></i>
                    </button>
                </div>
            </div>

            <div class="auth-options">
                <label class="custom-check">
                    <input type="checkbox" name="remember">
                    <span>Remember me</span>
                </label>
                <span class="auth-link-text">Secure login</span>
            </div>

            <button type="submit" class="btn premium-btn w-100">
                <span>Login to Dashboard</span>
                <i class="bi bi-arrow-right-circle-fill"></i>
            </button>
        </form>

        <div class="auth-footer">
            <p>Don’t have an account? <a href="{{ url_for('register') }}">Create one</a></p>
        </div>
    </div>
</section>
{% endblock %}
